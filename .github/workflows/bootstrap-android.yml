name: Bootstrap Android

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v0.3-android-foundation
    paths:
      - package.json
      - capacitor.config.ts
      - .github/workflows/bootstrap-android.yml

permissions:
  contents: write

jobs:
  bootstrap-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.3-android-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Commit generated Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android
          if git diff --cached --quiet; then
            echo "Android project is already up to date."
          else
            git commit -m "build: generate Capacitor Android project"
            git push origin HEAD:feat/v0.3-android-foundation
          fi
